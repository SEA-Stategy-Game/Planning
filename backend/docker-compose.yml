services:
  planbackend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=data/plans.db
      - USE_REDIS=true
      - RedisConnection=redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  game-room-manager:
    build:
      context: ../../game-room-manager/
    ports:
      - "8080:8080"
