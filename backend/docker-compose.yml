services:
  planbackend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=data/plans.db
    volumes:
      - ./data:/app/data

  game-room-manager:
    build:
      context: ../../game-room-manager/
    ports:
      - "8080:8080"
